<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ORBAT Lab{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🧪</text></svg>">
  <style>
    /* Only what the real stylesheet has no class for yet. Everything else --
       cards, buttons, fields, flashes -- comes from web/static/style.css, so
       the prototype is judged in the skin it would actually ship in. */
    main { max-width: 1180px; }
    .labtag { font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
              color: var(--warn); border: 1px solid var(--warn); padding: 2px 8px;
              border-radius: 999px; }
    .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
    @media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
    .editor textarea { min-height: 520px; font: 14px/1.6 ui-monospace, SFMono-Regular,
                       Menlo, Consolas, monospace; tab-size: 2; }
    .stack { display: grid; gap: 14px; }
    .rowbtns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .pad { padding: 16px 18px; }

    /* The Discord embed, as faithfully as CSS gets. */
    .embed { background: var(--panel); border-left: 4px solid #5865f2; border-radius: 6px;
             padding: 14px 16px; }
    .embed h3 { margin: 0 0 6px; font-size: 16px; }
    .embed .desc { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 18px; }
    @media (max-width: 560px) { .fields { grid-template-columns: 1fr; } }
    .fieldname { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
    .fieldval { font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; }
    .fieldval .off { color: var(--muted); }
    .nocount { color: var(--muted); font-weight: 400; font-size: 12px; }

    .issues { margin: 0; padding-left: 18px; }
    .issues li { margin: 3px 0; }
    .lineno { font: 12px ui-monospace, monospace; background: var(--panel-2);
              border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

    .diff { list-style: none; margin: 0; padding: 0; font-size: 14px; }
    .diff li { padding: 4px 0; border-bottom: 1px solid var(--line); }
    .diff li:last-child { border-bottom: 0; }
    .tag { display: inline-block; min-width: 92px; font-size: 12px; font-weight: 600; }
    .tag.added { color: var(--ok); }
    .tag.removed { color: var(--err); }
    .tag.renamed { color: var(--warn); }
    .tag.kept { color: var(--muted); }

    .slotrow { display: flex; justify-content: space-between; align-items: center;
               gap: 10px; padding: 5px 0; border-bottom: 1px solid var(--line); }
    .slotrow:last-child { border-bottom: 0; }
    .slotrow form { margin: 0; }
    .mini { padding: 2px 8px; font-size: 12px; }
    .grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: end; }
    @media (max-width: 720px) { .grid3 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span>🧪 ORBAT Lab</span></a>
    <span class="labtag">Stufe A · ohne Discord &amp; Sheets</span>
  </header>
  <main>
    {% if msg %}<div class="flash">{{ msg }}</div>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer class="foot">
    Prototyp — eigene SQLite-Datei, keine Verbindung zur Produktions-Datenbank.
  </footer>
</body>
</html>
