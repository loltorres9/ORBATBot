<nav class="tabs">
  <a class="tab {{ 'active' if active == 'events' else '' }}" href="/g/{{ guild.id }}">📅 Events</a>

  <a class="tab {{ 'active' if active == 'voice' else '' }}" href="/g/{{ guild.id }}/voice">🔊 Voice time</a>
  {% if is_admin %}

  {% endif %}
</nav>
