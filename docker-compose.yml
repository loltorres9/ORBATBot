services:
  bot:
    build: .
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GOOGLE_CREDENTIALS=${GOOGLE_CREDENTIALS}
      - DATABASE_URL=postgresql://orbatuser:${DB_PASSWORD}@db:5432/orbatbot
      # Web UI — empty values simply leave it switched off
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - WEB_SECRET_KEY=${WEB_SECRET_KEY:-}
      - WEB_BASE_URL=${WEB_BASE_URL:-}
      - WEB_PORT=8080
    # The site is only reachable once the three variables above are set.
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=orbatbot
      - POSTGRES_USER=orbatuser
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbatuser -d orbatbot"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
